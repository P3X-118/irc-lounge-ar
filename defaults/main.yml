---
# Project source code URL: https://github.com/thelounge/thelounge-docker

thelounge_enabled: true

thelounge_identifier: thelounge
thelounge_base_path: "/{{ thelounge_identifier }}"
thelounge_data_path: "{{ thelounge_base_path }}/data"

# renovate: datasource=docker depName=thelounge/thelounge versioning=semver
thelounge_version: 4.4.3

thelounge_uid: ""
thelounge_gid: ""

# The scheme used for serving The Lounge.
thelounge_scheme: https

# The hostname at which The Lounge is served.
thelounge_hostname: ""

# The path at which The Lounge is served.
# This value must either be `/` or not end with a slash (e.g. `/thelounge`).
#
# Hosting The Lounge under a subpath does not seem to be possible due to The Lounge's
# technical limitations.
thelounge_path_prefix: /

thelounge_container_image: "{{ thelounge_container_image_registry_prefix }}thelounge/thelounge:{{ thelounge_container_image_tag }}"
thelounge_container_image_tag: "{{ thelounge_version }}"
thelounge_container_image_registry_prefix: "{{ thelounge_container_image_registry_prefix_upstream }}"
thelounge_container_image_registry_prefix_upstream: "{{ thelounge_container_image_registry_prefix_upstream_default }}"
thelounge_container_image_registry_prefix_upstream_default: docker.io/
thelounge_container_image_force_pull: "{{ thelounge_container_image.endswith(':latest') }}"

thelounge_container_image_self_build: false
thelounge_container_image_self_build_name: "thelounge/thelounge-docker:{{ thelounge_container_image_self_build_repo_version }}"
thelounge_container_image_self_build_repo: "https://github.com/thelounge/thelounge-docker.git"
thelounge_container_image_self_build_repo_version: "{{ thelounge_version if thelounge_version != 'latest' else 'main' }}"
thelounge_container_image_self_build_src_files_path: "{{ thelounge_base_path }}/docker-src"

# The base container network. It will be auto-created by this role if it doesn't exist already.
thelounge_container_network: "{{ thelounge_identifier }}"

# Control if the container network is deleted on uninstalling.
thelounge_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `thelounge_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
thelounge_container_http_host_bind_port: ""

# Specify how the container publishes its TCP port (as defined by `thelounge_container_identd_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
thelounge_container_identd_host_bind_port: ""

# The port number in the container
thelounge_container_http_port: 9000

# The port number in the container
thelounge_container_identd_port: 9001

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
thelounge_container_additional_networks: "{{ thelounge_container_additional_networks_auto + thelounge_container_additional_networks_custom }}"
thelounge_container_additional_networks_auto: []
thelounge_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
thelounge_container_additional_volumes: "{{ thelounge_container_additional_volumes_auto + thelounge_container_additional_volumes_custom }}"
thelounge_container_additional_volumes_auto: []
thelounge_container_additional_volumes_custom: []

# thelounge_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `thelounge_container_labels_additional_labels_custom`.
thelounge_container_labels_traefik_enabled: true
thelounge_container_labels_traefik_docker_network: "{{ thelounge_container_network }}"
thelounge_container_labels_traefik_hostname: "{{ thelounge_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/thelounge`).
thelounge_container_labels_traefik_path_prefix: "{{ thelounge_path_prefix }}"
thelounge_container_labels_traefik_rule: "Host(`{{ thelounge_container_labels_traefik_hostname }}`){% if thelounge_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ thelounge_container_labels_traefik_path_prefix }}`){% endif %}"
thelounge_container_labels_traefik_priority: 0
thelounge_container_labels_traefik_entrypoints: web-secure
thelounge_container_labels_traefik_tls: "{{ thelounge_container_labels_traefik_entrypoints != 'web' }}"
thelounge_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `thelounge_container_labels_traefik_additional_request_headers_custom`
thelounge_container_labels_traefik_additional_request_headers: "{{ thelounge_container_labels_traefik_additional_request_headers_auto | combine(thelounge_container_labels_traefik_additional_request_headers_custom) }}"
thelounge_container_labels_traefik_additional_request_headers_auto: {}
thelounge_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `thelounge_container_labels_traefik_additional_response_headers_custom`
thelounge_container_labels_traefik_additional_response_headers: "{{ thelounge_container_labels_traefik_additional_response_headers_auto | combine(thelounge_container_labels_traefik_additional_response_headers_custom) }}"
thelounge_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': thelounge_http_header_xss_protection} if thelounge_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': thelounge_http_header_content_type_options} if thelounge_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': thelounge_http_header_content_security_policy} if thelounge_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': thelounge_http_header_permissions_policy} if thelounge_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': thelounge_http_header_strict_transport_security} if thelounge_http_header_strict_transport_security and thelounge_container_labels_traefik_tls else {})
  }}
thelounge_container_labels_traefik_additional_response_headers_custom: {}

# thelounge_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `thelounge_container_labels_additional_labels_custom`
#
# Example:
# thelounge_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
thelounge_container_labels_additional_labels: "{{ thelounge_container_labels_additional_labels_auto + thelounge_container_labels_additional_labels_custom }}"
thelounge_container_labels_additional_labels_auto: []
thelounge_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
thelounge_container_extra_arguments: "{{ thelounge_container_extra_arguments_auto + thelounge_container_extra_arguments_custom }}"
thelounge_container_extra_arguments_auto: []
thelounge_container_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
thelounge_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
thelounge_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
thelounge_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
thelounge_http_header_permissions_policy: "{{ 'interest-cohort=()' if thelounge_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
thelounge_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if thelounge_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `thelounge_http_header_permissions_policy`
thelounge_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `thelounge_http_header_strict_transport_security`
thelounge_hsts_preload_enabled: false

# List of systemd services that The Lounge systemd service depends on
thelounge_systemd_required_services_list: "{{ thelounge_systemd_required_services_list_default + thelounge_systemd_required_services_list_auto + thelounge_systemd_required_services_list_custom }}"
thelounge_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
thelounge_systemd_required_services_list_auto: []
thelounge_systemd_required_services_list_custom: []

# List of systemd services that The Lounge systemd service wants
thelounge_systemd_wanted_services_list: "{{ thelounge_systemd_wanted_services_list_default + thelounge_systemd_wanted_services_list_auto + thelounge_systemd_wanted_services_list_custom }}"
thelounge_systemd_wanted_services_list_default: []
thelounge_systemd_wanted_services_list_auto: []
thelounge_systemd_wanted_services_list_custom: []

# See `templates/config.js.j2` for detailed descriptions
# (courtesy of The Lounge's project contributors) about how to configure them.
# Also see: https://thelounge.chat/docs/configuration
thelounge_config_public: false
thelounge_config_host: undefined
thelounge_config_bind: undefined
thelounge_config_reverse_proxy: false
thelounge_config_max_history: 10000
thelounge_config_https: |
  {
    enable: false,
    key: "",
    certificate: "",
    ca: "",
  }
thelounge_config_theme: default
thelounge_config_prefetch: false
thelounge_config_disable_media_preview: false
thelounge_config_prefetch_storage: false
thelounge_config_prefetch_max_image_size: 2048
thelounge_config_prefetch_max_search_size: 50
thelounge_config_prefetch_timeout: 5000
thelounge_config_file_upload: |
  {
    enable: false,
    maxFileSize: 10240,
    baseUrl: null,
  }
thelounge_config_transports: ["polling", "websocket"]
thelounge_config_leave_message: "The Lounge - https://thelounge.chat"
thelounge_config_defaults: |
  {
    name: "Libera.Chat",
    host: "irc.libera.chat",
    port: 6697,
    password: "",
    tls: true,
    rejectUnauthorized: true,
    nick: "thelounge%%",
    username: "thelounge",
    realname: "",
    join: "#thelounge",
    leaveMessage: "",
  }
thelounge_config_lock_network: false
thelounge_config_message_storage: ["sqlite", "text"]
thelounge_config_storage_policy: |
  {
    enabled: false,
    maxAgeDays: 7,
    deletionPolicy: "statusOnly",
  }
thelounge_config_use_hex_ip: false
thelounge_config_webirc: "null"
thelounge_config_identd: |
  {
    enable: false,
    {% if thelounge_container_identd_host_bind_port %}port: {{ thelounge_container_identd_host_bind_port }},{% endif %}
  }
thelounge_config_oidentd: "null"
thelounge_config_ldap__enable: false
thelounge_config_ldap__url: ldaps://example.com
thelounge_config_ldap__tls_options: {}
thelounge_config_ldap__primary_key: uid
thelounge_config_ldap__search_dn__root_dn: cn=thelounge,ou=system-users,dc=example,dc=com
thelounge_config_ldap__search_dn__root_password: 1234
thelounge_config_ldap__search_dn__filter: (&(objectClass=person)(memberOf=ou=accounts,dc=example,dc=com))
thelounge_config_ldap__search_dn__base: dc=example,dc=com
thelounge_config_ldap__search_dn__scope: sub
thelounge_config_debug__irc_framework: false
thelounge_config_debug__raw: false

# Specify the timezone
thelounge_environment_variables_tz: UTC

# Additional environment variables.
thelounge_environment_variables_additional_variables: ""

# thelounge_restart_necessary controls whether The Lounge systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
thelounge_restart_necessary: false
