---
- name: Ensure The Lounge paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ thelounge_uid }}"
    group: "{{ thelounge_gid }}"
  with_items:
    - "{{ thelounge_base_path }}"
    - "{{ thelounge_data_path }}"

- name: Ensure The Lounge support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ thelounge_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ thelounge_uid }}"
    group: "{{ thelounge_gid }}"
  with_items:
    - env
    - labels
  register: thelounge_support_files_result

- name: Ensure The Lounge configuration file installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/config.js.j2"
    dest: "{{ thelounge_data_path }}/config.js"
    mode: "0640"
    owner: "{{ thelounge_uid }}"
    group: "{{ thelounge_gid }}"
  register: thelounge_config_file_result

- name: Run if self-building of The Lounge container image is not enabled
  when: "not thelounge_container_image_self_build | bool"
  block:
    - name: Ensure The Lounge container image is pulled via community.docker.docker_image
      when: sysd_docker_image_pull_method == 'ansible-module'
      community.docker.docker_image:
        name: "{{ thelounge_container_image }}"
        source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"
        force_source: "{{ thelounge_container_image_force_pull if ansible_version.major > 2 or ansible_version.minor >= 8 else omit }}"
        force: "{{ omit if ansible_version.major > 2 or ansible_version.minor >= 8 else thelounge_container_image_force_pull }}"
      register: thelounge_container_image_pull_result
      retries: "{{ container_retry }}"
      delay: "{{ container_retry_delay }}"
      until: thelounge_container_image_pull_result is not failed

    - name: Ensure The Lounge container image is pulled via ansible.builtin.command
      when: sysd_docker_image_pull_method == 'command'
      ansible.builtin.command:
        cmd: "{{ sysd_docker_host_command }} pull {{ thelounge_container_image }}"
      register: thelounge_container_image_pull_result
      retries: "{{ container_retry }}"
      delay: "{{ container_retry_delay }}"
      until: thelounge_container_image_pull_result is not failed
      changed_when: "'Downloaded newer image' in thelounge_container_image_pull_result.stdout"

- name: Run if self-building of The Lounge container image is enabled
  when: "thelounge_container_image_self_build | bool"
  block:
    - name: Ensure The Lounge repository is present on self-build
      ansible.builtin.git:
        repo: "{{ thelounge_container_image_self_build_repo }}"
        version: "{{ thelounge_container_image_self_build_repo_version }}"
        dest: "{{ thelounge_container_image_self_build_src_files_path }}"
        force: "yes"
      register: thelounge_git_pull_results

    - name: Ensure The Lounge container image is built
      community.docker.docker_image:
        name: "{{ thelounge_container_image_self_build_name }}"
        source: build
        force_source: "{{ thelounge_git_pull_results.changed if ansible_version.major > 2 or ansible_version.minor >= 8 else omit }}"
        force: "{{ omit if ansible_version.major > 2 or ansible_version.minor >= 8 else thelounge_git_pull_results.changed }}"
        build:
          dockerfile: Dockerfile
          path: "{{ thelounge_container_image_self_build_src_files_path }}"
          pull: true
          args:
      register: thelounge_container_image_build_result

- name: Ensure The Lounge container network is created via community.docker.docker_network
  when: sysd_docker_net_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ sysd_docker_ipv6_enabled }}"
    name: "{{ thelounge_container_network }}"
    driver: bridge
    driver_options: "{{ sysd_docker_net_driver_opts }}"
  register: thelounge_network_creation_result

- name: Ensure The Lounge container network is created via ansible.builtin.command
  when: sysd_docker_net_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ sysd_docker_host_command }} network create
      {% if sysd_docker_ipv6_enabled %}--ipv6{% endif %}
      {{ sysd_docker_net_driver_opts_string }}
      {{ thelounge_container_network }}
  register: thelounge_network_creation_result
  changed_when: thelounge_network_creation_result.rc == 0
  failed_when: thelounge_network_creation_result.rc != 0 and 'already exists' not in thelounge_network_creation_result.stderr

- name: Ensure The Lounge systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/thelounge.service.j2"
    dest: "{{ sysd_docker_service_path }}/{{ thelounge_identifier }}.service"
    mode: "0644"
  register: thelounge_systemd_service_result

- name: Determine whether The Lounge needs a restart
  ansible.builtin.set_fact:
    thelounge_restart_necessary: >-
      {{
        thelounge_support_files_result.changed | default(false)
        or thelounge_config_file_result.changed | default(false)
        or thelounge_systemd_service_result.changed | default(false)
        or thelounge_container_image_pull_result.changed | default(false)
        or thelounge_container_image_build_result.changed | default(false)
      }}
