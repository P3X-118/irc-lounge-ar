---
- name: Perform The Lounge installation tasks
  when: docmost_enabled | bool
  tags:
    - setup-all
    - setup-docmost
    - install-all
    - install-docmost
  block:
    - name: Validate The Lounge configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install The Lounge
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform The Lounge uninstallation tasks
  when: not docmost_enabled | bool
  tags:
    - setup-all
    - setup-docmost
  block:
    - name: Uninstall The Lounge
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
